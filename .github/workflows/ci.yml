name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Download the published package for macOS verification
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.3.0 --repo "$GITHUB_REPOSITORY" --pattern 'codex-claude-bridge-feishu-1.3.0.tgz' --dir "$RUNNER_TEMP/released-bridge"

      - name: Verify macOS source and published package installation
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-install.mjs "$RUNNER_TEMP/released-bridge/codex-claude-bridge-feishu-1.3.0.tgz"

      - name: Upload macOS verification report
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-${{ matrix.os }}-node${{ matrix.node-version }}
          path: macos-verification.json
          if-no-files-found: ignore
